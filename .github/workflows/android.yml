name: Lilac Android

on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Write the Lilac signing key
        env:
          LILAC_KEYSTORE: ${{ secrets.LILAC_KEYSTORE }}
        run: printf '%s' "$LILAC_KEYSTORE" | tr -d '\r\n ' | base64 -d > app_pojavlauncher/lilac-release.jks

      - name: Build release APK
        env:
          LILAC_KEYSTORE_PASSWORD: ${{ secrets.LILAC_KEYSTORE_PASSWORD }}
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/LilacMobile-Release.apk
          sha256sum out/LilacMobile-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LilacMobile-Release.apk
          path: out/LilacMobile-Release.apk
